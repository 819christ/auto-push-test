<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Auto push test — code source (lecture seule)</title>
<meta name="robots" content="index,follow" />
<style>
  :root { --bg:#1e1e1e; --fg:#d4d4d4; --muted:#888; --accent:#3794ff; --border:#333; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-monospace, Consolas, monospace; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100vh; }
  header { padding:1rem 1.5rem; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:1rem; }
  header h1 { font-size:1.1rem; margin:0; }
  header .badge { background:#264f78; color:#9cdcfe; padding:0.15rem 0.5rem; border-radius:4px; font-size:0.8rem; }
  header a { color: var(--accent); margin-left:auto; text-decoration:none; }
  .layout { flex:1; display:flex; overflow:hidden; }
  .sidebar { width:280px; border-right:1px solid var(--border); overflow-y:auto; padding:0.5rem; }
  .sidebar input { width:100%; padding:0.4rem; background:#2d2d2d; border:1px solid var(--border); color:var(--fg); border-radius:4px; margin-bottom:0.5rem; }
  .tree-item { padding:0.25rem 0.4rem; cursor:pointer; white-space:nowrap; border-radius:4px; font-size:0.9rem; }
  .tree-item:hover { background:#2a2d2e; }
  .tree-item.active { background:#37373d; }
  .tree-folder { color:#dcb67a; font-weight:bold; }
  main { flex:1; overflow:auto; padding:0; }
  .file-header { padding:0.75rem 1.5rem; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:1rem; position:sticky; top:0; background:var(--bg); }
  .file-header button { background:#2d2d2d; border:1px solid var(--border); color:var(--fg); padding:0.3rem 0.7rem; border-radius:4px; cursor:pointer; }
  .code-viewer { counter-reset: line; font-size:0.9rem; padding:1rem 0; }
  .code-line { display:flex; min-height:1.4em; }
  .code-line::before { counter-increment: line; content: counter(line); display:inline-block; width:3em; text-align:right; margin-right:1em; color:var(--muted); user-select:none; flex-shrink:0; }
  .code-line-content { white-space:pre; flex:1; }
  .status { padding:2rem; color:var(--muted); }
  .loading { padding:2rem; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Auto push test</h1>
  <span class="badge">main</span>
  <span class="badge">Lecture seule</span>
  <a href="https://github.com/819christ/auto-push-test" target="_blank">Dépôt GitHub ↗</a>
</header>
<div class="layout">
  <div class="sidebar">
    <input id="filter" placeholder="Filtrer les fichiers..." />
    <div id="tree" class="loading">Chargement de l'arborescence...</div>
  </div>
  <main>
    <div id="fileHeader" class="file-header" style="display:none">
      <strong id="filePath"></strong>
      <button id="copyBtn">Copier</button>
      <a id="rawLink" href="#" target="_blank" style="color:var(--accent)">Fichier brut</a>
    </div>
    <div id="content" class="status">Sélectionne un fichier dans la liste à gauche.</div>
  </main>
</div>
<script>
const OWNER = "819christ";
const REPO = "auto-push-test";
const BRANCH = "main";
const EXCLUDED_PREFIXES = ["docs/", ".git/", ".vscode/"];

let allPaths = [];

function isExcluded(path) {
  return EXCLUDED_PREFIXES.some(p => path.startsWith(p));
}

async function loadTree() {
  const treeEl = document.getElementById("tree");
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    allPaths = data.tree
      .filter(item => item.type === "blob" && !isExcluded(item.path))
      .map(item => item.path)
      .sort();
    renderTree(allPaths);
  } catch (err) {
    treeEl.textContent = "Impossible de charger la liste des fichiers (" + err.message + "). Réessaie dans quelques instants.";
  }
}

function renderTree(paths) {
  const treeEl = document.getElementById("tree");
  if (paths.length === 0) {
    treeEl.textContent = "Aucun fichier publié pour le moment.";
    return;
  }
  treeEl.innerHTML = "";
  for (const path of paths) {
    const div = document.createElement("div");
    div.className = "tree-item";
    div.textContent = path;
    div.onclick = () => openFile(path, div);
    treeEl.appendChild(div);
  }
}

async function openFile(path, el) {
  document.querySelectorAll(".tree-item").forEach(e => e.classList.remove("active"));
  if (el) el.classList.add("active");

  const contentEl = document.getElementById("content");
  const fileHeaderEl = document.getElementById("fileHeader");
  document.getElementById("filePath").textContent = path;
  const rawUrl = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${path}`;
  document.getElementById("rawLink").href = rawUrl;
  fileHeaderEl.style.display = "flex";
  contentEl.className = "loading";
  contentEl.textContent = "Chargement du contenu...";

  try {
    const res = await fetch(rawUrl);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    renderCode(text);
  } catch (err) {
    contentEl.className = "status";
    contentEl.textContent = "Impossible de charger ce fichier (" + err.message + ").";
  }
}

function renderCode(text) {
  const contentEl = document.getElementById("content");
  contentEl.className = "code-viewer";
  contentEl.innerHTML = "";
  const lines = text.split("\n");
  for (const line of lines) {
    const row = document.createElement("div");
    row.className = "code-line";
    const span = document.createElement("span");
    span.className = "code-line-content";
    span.textContent = line;
    row.appendChild(span);
    contentEl.appendChild(row);
  }
}

document.getElementById("copyBtn").onclick = async () => {
  const text = Array.from(document.querySelectorAll(".code-line-content")).map(e => e.textContent).join("\n");
  await navigator.clipboard.writeText(text);
  const btn = document.getElementById("copyBtn");
  const original = btn.textContent;
  btn.textContent = "Copié !";
  setTimeout(() => (btn.textContent = original), 1500);
};

document.getElementById("filter").addEventListener("input", (e) => {
  const q = e.target.value.toLowerCase();
  renderTree(allPaths.filter(p => p.toLowerCase().includes(q)));
});

loadTree();
</script>
</body>
</html>
